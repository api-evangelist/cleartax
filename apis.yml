aid: cleartax
name: Cleartax
description: >-
  Cleartax (operating as Clear, clear.in) is an Indian fintech and financial-compliance
  automation platform that provides tax, GST, and e-invoicing software for individuals,
  tax professionals, and over 4,000 enterprises. Clear exposes a suite of developer APIs
  through its documentation portal at docs.cleartax.in, including the Clear Finance Cloud
  (CFC) ingestion APIs, the GST 2.0 / GSP filing API, the Max ITC input-tax-credit
  reconciliation API, the GLS API, the E-Invoicing and E-Waybill APIs (with government
  IRP/NIC-compatible endpoints and DSC signing), the Invoicing API, and KSA (Saudi Arabia)
  e-invoicing APIs. APIs authenticate with a client secret exchanged for an access token
  and run against production (api.clear.in) and sandbox (api-sandbox.clear.in) hosts.
