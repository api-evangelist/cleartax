summary: >-
  Clear provides a dedicated sandbox environment separated from production by host. The
  sandbox base host for India is api-sandbox.clear.in; production is api.clear.in. Base URL
  also varies by region (India vs KSA). Sandbox access requires an API client secret
  generated from the Clear UI.
environments:
- name: sandbox
  region: India
  base_url: https://api-sandbox.clear.in
  token_url: https://api-sandbox.clear.in/integration/v1/authz/token
- name: production
  region: India
  base_url: https://api.clear.in
  token_url: https://api.clear.in/integration/v1/authz/token
credentials:
  how_to_get: >-
    Generate an API client secret from the Clear UI, then exchange it at the Generate
    Access Token API for an access token.
  header_secret: x-clear-client-secret
  header_token: x-cleartax-auth-token
